server {
  listen 8080;
  root /usr/share/nginx/html;

  # The API is another container; the browser only ever talks to this origin, so no CORS is needed.
  location /graphql {
    proxy_pass http://api:8080/graphql;
    proxy_set_header Host $host;
  }

  # Client-side routes (/policies/123) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
