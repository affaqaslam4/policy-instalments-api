services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Mongo: mongodb://mongo:27017
      Mongo__Database: policy_instalments
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  mongo-data:
